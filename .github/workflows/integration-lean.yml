name: lean-integration
on:
  pull_request:
    paths:
      - '.gitmodules'
      - 'external/lean'
      - 'global.json'
      - 'src/qros_lean/**'
      - 'scripts/validate_lean_pin.py'
      - 'scripts/apply_lean_security_patch.py'
      - 'scripts/validate_lean_patch_audit.py'
      - 'scripts/run_lean_synthetic_backtest.py'
      - 'integration/lean/**'
      - 'fixtures_synthetic/lean/**'
      - 'packages/contracts/**'
      - 'packages/schemas/lean-backtest-result.v1.schema.json'
      - 'config/dependency-registry.json'
      - 'supply-chain/**'
      - '.github/workflows/integration-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lean-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout QROS and pinned LEAN
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.400'
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14.7'
          check-latest: false
      - name: Verify pins
        run: |
          test "$(dotnet --version)" = "10.0.400"
          test "$(python --version)" = "Python 3.14.7"
          python scripts/validate_lean_pin.py --require-populated
      - name: Apply deterministic LEAN security patch candidate
        run: python scripts/apply_lean_security_patch.py
      - name: Build patched LEAN Launcher
        run: dotnet build external/lean/Launcher/QuantConnect.Lean.Launcher.csproj --configuration Release --nologo -p:ContinuousIntegrationBuild=true
      - name: Audit patched LEAN dependency graph
        shell: bash
        run: |
          dotnet package list --project external/lean/Launcher/QuantConnect.Lean.Launcher.csproj --include-transitive --format json --output-version 1 > "$RUNNER_TEMP/lean-all.json"
          dotnet package list --project external/lean/Launcher/QuantConnect.Lean.Launcher.csproj --include-transitive --vulnerable --format json --output-version 1 > "$RUNNER_TEMP/lean-vulnerable.json"
          python scripts/validate_lean_patch_audit.py --all "$RUNNER_TEMP/lean-all.json" --vulnerable "$RUNNER_TEMP/lean-vulnerable.json"
      - name: Build QROS synthetic algorithm
        run: dotnet build integration/lean/QrosSyntheticAlgorithm/QrosSyntheticAlgorithm.csproj --configuration Release --nologo -p:ContinuousIntegrationBuild=true
      - name: Run deterministic QROS to LEAN backtest twice
        env:
          PYTHONPATH: src
        run: python scripts/run_lean_synthetic_backtest.py --output-dir "$RUNNER_TEMP/qros-phase3d"
      - name: Verify Phase 3B normalized baseline hash
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = "sha256:6da211cffdf7f667b212f9bf083d9f2d78e40b42895e6b6ed0342b76b5d6e5f1"
          result_path = Path(os.environ["RUNNER_TEMP"]) / "qros-phase3d" / "lean-backtest-result.v1.json"
          result = json.loads(result_path.read_text(encoding="utf-8"))
          actual = result.get("normalized_hash")
          if actual != expected:
              raise SystemExit(
                  f"Phase 3B normalized baseline hash mismatch: expected {expected}, got {actual}"
              )
          print(f"Phase 3B normalized baseline hash: PASS ({actual})")
          PY
      - name: Confirm promotion remains review-gated
        run: |
          echo "Candidate dependency gate passed only if all prior steps succeeded."
          echo "Runtime promotion remains DENY until ADR/security review is accepted."
