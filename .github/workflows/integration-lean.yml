name: lean-integration
on:
  pull_request:
    paths:
      - '.gitmodules'
      - 'external/lean'
      - 'global.json'
      - 'src/qros_lean/**'
      - 'scripts/validate_lean_pin.py'
      - 'scripts/apply_lean_security_patch.py'
      - 'scripts/validate_lean_patch_audit.py'
      - 'scripts/validate_lean_nuget_graph.py'
      - 'scripts/validate_lean_nuget_licenses.py'
      - 'scripts/validate_lean_nuget_sbom.py'
      - 'scripts/run_lean_synthetic_backtest.py'
      - 'scripts/validate_lean_semantic_regression.py'
      - 'integration/lean/**'
      - 'fixtures_synthetic/lean/**'
      - 'packages/contracts/**'
      - 'packages/schemas/lean-backtest-result.v*.schema.json'
      - 'packages/schemas/provenance-record.v*.schema.json'
      - 'config/dependency-registry.json'
      - 'config/lean-security-review.json'
      - 'scripts/validate_lean_security.py'
      - 'tests/test_lean_security_policy.py'
      - 'config/lean-nuget-license-dispositions.json'
      - 'supply-chain/**'
      - '.github/workflows/integration-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lean-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout QROS and pinned LEAN
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.400'
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14.7'
          check-latest: false
      - name: Verify pins
        run: |
          test "$(dotnet --version)" = "10.0.400"
          test "$(python --version)" = "Python 3.14.7"
          python scripts/validate_lean_pin.py --require-populated
      - name: Print Phase 3D supply-chain evidence SHA256
        run: |
          sha256sum \
            .github/workflows/integration-lean.yml \
            CHANGELOG.md \
            config/dependency-registry.json \
            config/lean-nuget-license-dispositions.json \
            config/lean-security-review.json \
            docs/adr/0010-phase-3d-lean-security-patch-candidate.md \
            docs/security/LEAN_DEPENDENCY_SECURITY_REVIEW.md \
            docs/source-evidence/phase-3d-lean-security-patch-candidate.md \
            scripts/apply_lean_security_patch.py \
            scripts/validate_lean_nuget_graph.py \
            scripts/validate_lean_nuget_licenses.py \
            scripts/validate_lean_nuget_sbom.py \
            scripts/validate_lean_patch_audit.py \
            scripts/validate_lean_security.py \
            scripts/validate_lean_semantic_regression.py \
            scripts/validate_supply_chain.py \
            src/qros_lean/backtest.py \
            supply-chain/bom.cdx.json \
            supply-chain/dependency-license-manifest.json \
            supply-chain/provenance-manifest.json \
            supply-chain/source-revisions.json \
            supply-chain/lean/launcher-patched-bom.cdx.json \
            supply-chain/lean/launcher-patched-nuget-graph.json \
            supply-chain/lean/launcher-patched-nuget-license-metadata.json \
            tests/test_lean_backtest_normalizer.py \
            tests/test_lean_security_policy.py \
            tests/test_supply_chain.py
      - name: Apply deterministic LEAN security patch candidate
        run: python scripts/apply_lean_security_patch.py
      - name: Restore patched LEAN Launcher
        run: dotnet restore external/lean/Launcher/QuantConnect.Lean.Launcher.csproj --nologo
      - name: Restore QROS synthetic algorithm
        run: dotnet restore integration/lean/QrosSyntheticAlgorithm/QrosSyntheticAlgorithm.csproj --nologo
      - name: Verify canonical patched Launcher NuGet graph
        run: python scripts/validate_lean_nuget_graph.py --assets external/lean/Launcher/obj/project.assets.json --expected supply-chain/lean/launcher-patched-nuget-graph.json
      - name: Verify patched Launcher NuGet licenses
        run: python scripts/validate_lean_nuget_licenses.py --assets external/lean/Launcher/obj/project.assets.json --expected-metadata supply-chain/lean/launcher-patched-nuget-license-metadata.json --manual-dispositions config/lean-nuget-license-dispositions.json
      - name: Verify patched Launcher CycloneDX SBOM
        run: python scripts/validate_lean_nuget_sbom.py --graph supply-chain/lean/launcher-patched-nuget-graph.json --metadata supply-chain/lean/launcher-patched-nuget-license-metadata.json --manual-dispositions config/lean-nuget-license-dispositions.json --expected supply-chain/lean/launcher-patched-bom.cdx.json
      - name: Build patched LEAN Launcher
        run: dotnet build external/lean/Launcher/QuantConnect.Lean.Launcher.csproj --configuration Release --nologo --no-restore -p:ContinuousIntegrationBuild=true
      - name: Audit patched LEAN dependency graph
        shell: bash
        run: |
          dotnet package list --project external/lean/Launcher/QuantConnect.Lean.Launcher.csproj --include-transitive --no-restore --format json --output-version 1 > "$RUNNER_TEMP/lean-all.json"
          dotnet package list --project external/lean/Launcher/QuantConnect.Lean.Launcher.csproj --include-transitive --vulnerable --no-restore --format json --output-version 1 > "$RUNNER_TEMP/lean-vulnerable.json"
          python scripts/validate_lean_patch_audit.py --all "$RUNNER_TEMP/lean-all.json" --vulnerable "$RUNNER_TEMP/lean-vulnerable.json"
      - name: Build QROS synthetic algorithm
        run: dotnet build integration/lean/QrosSyntheticAlgorithm/QrosSyntheticAlgorithm.csproj --configuration Release --nologo --no-restore -p:ContinuousIntegrationBuild=true
      - name: Run deterministic QROS to LEAN backtest twice
        env:
          PYTHONPATH: src
        run: python scripts/run_lean_synthetic_backtest.py --output-dir "$RUNNER_TEMP/qros-phase3e"
      - name: Verify Phase 3B quantitative semantic regression baseline
        env:
          PYTHONPATH: src
        run: python scripts/validate_lean_semantic_regression.py "$RUNNER_TEMP/qros-phase3e/lean-backtest-result.v2.json"
      - name: Confirm accepted runtime scope remains restricted
        run: |
          python scripts/validate_lean_security.py --enforce-runtime-promotion
          echo "ALLOW applies only to the Phase 3D patched local Research/Backtest runtime."
          echo "Packaging, release, Yuanta integration, and live trading remain DENY."
