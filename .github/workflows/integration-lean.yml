name: lean-integration
on:
  pull_request:
    paths:
      - '.gitmodules'
      - 'external/lean'
      - 'global.json'
      - 'src/qros_lean/**'
      - 'scripts/validate_lean_pin.py'
      - 'scripts/run_lean_synthetic_backtest.py'
      - 'integration/lean/**'
      - 'fixtures_synthetic/lean/**'
      - 'packages/contracts/**'
      - 'packages/schemas/lean-backtest-result.v1.schema.json'
      - 'config/dependency-registry.json'
      - 'supply-chain/**'
      - '.github/workflows/integration-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lean-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lean-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout QROS and pinned LEAN
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.400'
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14.7'
          check-latest: false
      - name: Verify pins
        run: |
          test "$(dotnet --version)" = "10.0.400"
          test "$(python --version)" = "Python 3.14.7"
          python scripts/validate_lean_pin.py --require-populated
      - name: Print Phase 3B canonical SHA256 evidence
        shell: bash
        run: |
          sha256sum \
            .github/workflows/integration-lean.yml \
            CHANGELOG.md \
            docs/adr/0006-deterministic-lean-synthetic-backtest.md \
            docs/security/NETWORK_ENDPOINTS.md \
            docs/security/PROCESS_TREE.md \
            docs/source-evidence/phase-3b-synthetic-backtest-evidence.md \
            fixtures_synthetic/lean/qros-synthetic-daily.csv \
            integration/lean/QrosSyntheticAlgorithm/QrosSyntheticAlgorithm.csproj \
            integration/lean/QrosSyntheticAlgorithm/QrosSyntheticBacktestAlgorithm.cs \
            integration/lean/backtest-config.json \
            packages/contracts/contract-digests.json \
            packages/contracts/contract-manifest.json \
            packages/schemas/lean-backtest-result.v1.schema.json \
            scripts/run_lean_synthetic_backtest.py \
            src/qros_lean/backtest.py \
            supply-chain/build-environment.json \
            tests/test_lean_backtest_normalizer.py \
            tests/test_phase3b_contract.py
      - name: Build pinned LEAN Launcher
        run: dotnet build external/lean/Launcher/QuantConnect.Lean.Launcher.csproj --configuration Release --nologo -p:ContinuousIntegrationBuild=true
      - name: Build QROS synthetic algorithm
        run: dotnet build integration/lean/QrosSyntheticAlgorithm/QrosSyntheticAlgorithm.csproj --configuration Release --nologo -p:ContinuousIntegrationBuild=true
      - name: Run deterministic QROS to LEAN backtest twice
        env:
          PYTHONPATH: src
        run: python scripts/run_lean_synthetic_backtest.py --output-dir "$RUNNER_TEMP/qros-phase3b"
