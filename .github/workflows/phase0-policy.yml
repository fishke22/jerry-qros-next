name: qros-gate
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qros-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  governance-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full repository history for historical tree verification
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Fetch durable Phase 3D accepted-head evidence
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/evidence/phase-3d-accepted-head:refs/remotes/origin/evidence/phase-3d-accepted-head
          test "$(git rev-parse refs/remotes/origin/evidence/phase-3d-accepted-head)" = "7b5f89a1972fd39abb78e0ad998eacf874e42739"
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14.7'
          check-latest: false
      - name: Install Phase 2 locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/phase2.lock
      - name: Validate governance policies
        run: python scripts/validate_policies.py
      - name: Validate versioned contracts
        run: python scripts/validate_contracts.py
      - name: Enforce immutable contract versions
        run: python scripts/validate_contract_immutability.py
      - name: Validate supply-chain evidence
        run: python scripts/validate_supply_chain.py
      - name: Validate LEAN security blocker representation
        run: python scripts/validate_lean_security.py
      - name: Validate Phase 3C remediation research boundary
        run: python scripts/validate_lean_remediation_research.py
      - name: Print Phase 3E sealing SHA256
        run: |
          sha256sum \
            .github/workflows/phase0-policy.yml \
            packages/contracts/contract-digests.json \
            packages/schemas/lean-backtest-result.v2.schema.json \
            packages/schemas/provenance-record.v2.schema.json \
            scripts/validate_lean_patch_audit.py \
            src/qros_lean/runtime_overlay.py \
            tests/test_lean_patch_audit.py \
            tests/test_lean_runtime_overlay.py \
            tests/test_phase3b_contract.py
      - name: Validate SHA256SUMS
        run: python scripts/validate_sha256sums.py
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
