name: qros-gate
on:
  pull_request:
  push:
    branches:
      - main
      - foundation/phase-0-governance
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qros-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  governance-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate governance policies
        run: python scripts/validate_policies.py
      - name: Validate versioned contracts
        run: python scripts/validate_contracts.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
