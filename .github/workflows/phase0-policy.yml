name: qros-gate
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qros-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  governance-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14.7'
          check-latest: false
      - name: Install Phase 2 locked dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/phase2.lock
      - name: Validate governance policies
        run: python scripts/validate_policies.py
      - name: Validate versioned contracts
        run: python scripts/validate_contracts.py
      - name: Enforce immutable contract versions
        run: python scripts/validate_contract_immutability.py
      - name: Validate supply-chain evidence
        run: python scripts/validate_supply_chain.py
      - name: Validate LEAN security blocker representation
        run: python scripts/validate_lean_security.py
      - name: Validate SHA256SUMS
        run: python scripts/validate_sha256sums.py
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
